<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña — ERP Desarmaduría</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/png" href="/img/logo.png">
</head>
<body>
<div id="app-topbar"></div>
<main style="max-width:420px">
  <h1>🔑 Cambiar mi contraseña</h1>
  <div class="card">
    <label for="password-actual">Contraseña actual</label>
    <input id="password-actual" type="password">
    <label for="password-nueva">Contraseña nueva</label>
    <input id="password-nueva" type="password">
    <label for="password-confirmar">Confirmar contraseña nueva</label>
    <input id="password-confirmar" type="password">
    <div style="margin-top:16px">
      <button class="btn" id="btn-cambiar">Guardar nueva contraseña</button>
    </div>
    <div id="mensaje"></div>
  </div>
</main>
<footer>Sistema de gestión para desarmadurías — acceso restringido a personal autorizado.</footer>
<script src="/js/common.js"></script>
<script>window.__sesion = ErpAuth.iniciarSesionBar();</script>

</body>
</html>
